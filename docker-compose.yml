services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Replace CLUSTER_ID with a unique base64 UUID using "bin/kafka-storage.sh random-uuid"
      # See https://docs.confluent.io/kafka/operations-tools/kafka-tools.html#kafka-storage-sh
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    networks:
      - pipeline

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-raw --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-aggregated --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-alerts --partitions 1 --replication-factor 1 &&
      echo 'All topics created.'
      "
    networks:
      - pipeline

  producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: event-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: ${MINIO_BUCKET:-air-quality-minutely}
      MINIO_BUCKET_HISTORICAL: ${MINIO_BUCKET_HISTORICAL:-air-quality-historical}
      REPLAY_SPEED: ${REPLAY_SPEED:-1000}
      PRODUCER_MODE: ${PRODUCER_MODE:-replay}
      OWM_API_KEY: ${OWM_API_KEY:-}
    networks:
      - pipeline
    restart: unless-stopped

  # ===== TIMESCALEDB =====
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airquality
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d airquality"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  # ===== FLINK =====
  flink-jobmanager:
    build: ./flink-jobs
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - "FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - flink_baselines:/opt/flink/usrlib/src/baselines
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-taskmanager:
    build: ./flink-jobs
    container_name: flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink_baselines:/opt/flink/usrlib/src/baselines
    networks:
      - pipeline

  flink-job:
    build: ./flink-jobs
    container_name: flink-job-submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for TaskManager to register...';
      sleep 20;
      echo 'Submitting Flink job...';
      /opt/flink/bin/flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/src/stream_processor.py -d;
      echo 'Flink job submitted. Container will exit.';
      "
    networks:
      - pipeline
  historical-loader:
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: historical-loader
    depends_on:
      minio:
        condition: service_healthy
    environment:
      OWM_API_KEY: ${OWM_API_KEY}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      BASELINES_OUT: /baselines/baselines.json
    volumes:
      - flink_baselines:/baselines
    networks:
      - pipeline

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pipeline

  kafka-connect:
    build:
      context: ./kafka-connect
    container_name: kafka-connect
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: kafka-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pipeline
    restart: unless-stopped

  kafka-connect-init:
    image: curlimages/curl:latest
    container_name: kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./kafka-connect/connector.json:/connector.json
    command: >
      curl -sf -X POST http://kafka-connect:8083/connectors
      -H "Content-Type: application/json"
      -d @/connector.json
    networks:
      - pipeline

  alerting:
    build:
      context: ./alerting
      dockerfile: Dockerfile
    container_name: alerting
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@airquality.local}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@airquality.local}
    networks:
      - pipeline
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pipeline.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
  minio_data:
  flink_baselines: