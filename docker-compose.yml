services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    networks:
      - pipeline

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-raw --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-aggregated --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic air-quality-alerts --partitions 1 --replication-factor 1 &&
      echo 'All topics created.'
      "
    networks:
      - pipeline

  producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: event-producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      MINIO_ENDPOINT: ""
      MINIO_BUCKET: ${MINIO_BUCKET:-thesis-pipeline-data-lake-767397977983}
      REPLAY_SPEED: ${REPLAY_SPEED:-60}
      PRODUCER_MODE: ${PRODUCER_MODE:-replay}
      OWM_API_KEY: ${OWM_API_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - pipeline
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: airquality
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./timescaledb/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d airquality"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline

  flink-jobmanager:
    build: ./flink-jobs
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - "FLINK_PROPERTIES=jobmanager.rpc.address: flink-jobmanager"
    volumes:
      - flink_baselines:/opt/flink/usrlib/src/baselines
    networks:
      - pipeline
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  flink-taskmanager:
    build: ./flink-jobs
    container_name: flink-taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - flink_baselines:/opt/flink/usrlib/src/baselines
    networks:
      - pipeline

  flink-job:
    build: ./flink-jobs
    container_name: flink-job-submitter
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      timescaledb:
        condition: service_healthy
    command: >
      bash -c "
      echo 'Waiting for TaskManager to register...';
      sleep 20;
      echo 'Submitting Flink job...';
      /opt/flink/bin/flink run -m flink-jobmanager:8081 -py /opt/flink/usrlib/src/stream_processor.py -d;
      echo 'Flink job submitted.';
      "
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      BASELINES_FILE: /opt/flink/usrlib/src/baselines/baselines.json
    volumes:
      - flink_baselines:/opt/flink/usrlib/src/baselines
    networks:
      - pipeline

  alerting:
    build:
      context: ./alerting
      dockerfile: Dockerfile
    container_name: alerting
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-alerts@airquality.local}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@airquality.local}
    networks:
      - pipeline
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - pipeline

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pipeline.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge

volumes:
  grafana_data:
  timescaledb_data:
  flink_baselines:
